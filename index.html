<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAPPY BIRTHDAY ARUNA</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="Container">

    <!-- PAGE 1 -->
    <div class="Picture page" id="page1">
      <img class="Picture-img" src="IMG_2489.jpeg" alt="Happy">
      <div class="Picture-note">Happy 🎉❤️</div>
      <div class="swipe-hint">SWIPE TO CONTINUE ➜</div>
    </div>

    <!-- PAGE 2 -->
    <div class="Picture page" id="page2" hidden>
      <img class="Picture-img" src="IMG_2492.jpeg" alt="Birthday">
      <div class="Picture-note">Birthday 🎂💕</div>
      <div class="swipe-hint">SWIPE TO CONTINUE ➜</div>
    </div>

    <!-- PAGE 3: YES / NO -->
    <div class="Picture choice-card page" id="page3" hidden>

      <img
        class="Picture-img"
        src="F3B3EB89-F079-4EA7-9682-0309338778D0.png"
        alt="Question"
      >

      <div class="Picture-note">
        IF YES SWAP OR BLOCK ❤️
      </div>

      <div class="choice-buttons">
        <button id="yesBtn">YES ❤️</button>
        <button id="noBtn">NO 💔</button>
      </div>

    </div>

    <!-- HIDDEN PHOTOS: SHOW ONLY AFTER YES -->
    <section id="hiddenPages" hidden>

      <div class="Picture">
        <img class="Picture-img" src="IMG_2491.jpeg" alt="">
        <div class="Picture-note">Celebrate 🎉💖</div>
      </div>

      <div class="Picture">
        <img class="Picture-img" src="IMG_2494.jpeg" alt="">
        <div class="Picture-note">Gift 🎁❤️</div>
      </div>

      <div class="Picture">
        <img class="Picture-img" src="IMG_2493.jpeg" alt="">
        <div class="Picture-note">Love 💕🎈</div>
      </div>

      <div class="Picture">
        <img class="Picture-img" src="IMG_2495.jpeg" alt="">
        <div class="Picture-note">Joy ❤️🎂</div>
      </div>

      <div class="Picture">
        <img class="Picture-img" src="IMG_2495.jpeg" alt="">
        <div class="Picture-note">Fun 🎈💖</div>
      </div>

      <div class="Picture">
        <img class="Picture-img" src="IMG_2490.jpeg" alt="">
        <div class="Picture-note">Hugs 💖🎂</div>
      </div>

      <div class="Picture">
        <img class="Picture-img" src="IMG_2496.jpeg" alt="">
        <div class="Picture-note">Smile 🎉💕</div>
      </div>

      <div class="Picture">
        <img class="Picture-img" src="alapuza.jpeg" alt="">
        <div class="Picture-note">Yay 🎉💕</div>
      </div>

      <div class="Picture">
        <img
          class="Picture-img"
          src="B1DAB360-6248-43C3-8F19-F37FAA73132F.png"
          alt=""
        >
        <div class="Picture-note">I KNOW YOU WILL LAUGH 🎂❤️</div>
      </div>

      <div class="Picture">
        <img
          class="Picture-img"
          src="19042C7F-AA8E-4839-B449-0B39758CB5CD.jpeg"
          alt=""
        >
        <div class="Picture-note">ARUNA 💖🎂</div>
      </div>

    </section>

  </main>

  <!-- YES MESSAGE -->
  <div id="yesMessage" hidden>
    YAY! ❤️ I KNEW YOU WOULD SAY YES! 🥰
  </div>

  <script src="script.js"></script>

</body>
</html>
